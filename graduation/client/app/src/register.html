<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | IntegriMail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    .navbar {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: bold;
      color: #0099ff !important;
    }
    .navbar-brand:hover {
      color: #00ccff !important;
    }
    .navbar-brand img {
      width: 30px;
      height: 30px;
      margin-right: 8px;
    }
    .form-section {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 20px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .form-container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      border: 1px solid rgba(0, 153, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.1);
      max-width: 400px;
      width: 100%;
    }
    .form-control {
      margin-bottom: 12px;
      background-color: transparent;
      border: 2px solid #0099ff;
      color: white;
    }
    .form-control::placeholder {
      color: #ccc;
    }
    .form-control:focus {
      background-color: transparent;
      color: white;
      box-shadow: 0 0 8px #0099ff;
    }
    .btn-neon {
      background-color: #0099ff;
      color: #000;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px #0099ff;
      width: 100%;
    }
    .btn-neon:hover {
      background-color: #007acc;
      box-shadow: 0 0 15px #0099ff;
    }
    #successMsg {
      color: #00ff99;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <video autoplay muted loop class="video-bg">
    <source src="assets/videos/background.mp4" type="video/mp4">
  </video>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="assets/images/email-sec-icon.png" alt="Logo">
        IntegriMail
      </a>

      <div class="ml-auto">
        <a href="admin.html"
           class="btn font-weight-bold px-4 py-2"
           style="
             background-color: #007bff;
             color: white;
             border-radius: 25px;
             font-size: 16px;
             box-shadow: 0 0 10px #007bff90;
             transition: all 0.3s ease;
           "
           onmouseover="this.style.boxShadow='0 0 15px #007bffcc'"
           onmouseout="this.style.boxShadow='0 0 10px #007bff90'">
          Admin Panel
        </a>
      </div>

    </div>
  </nav>
  <div class="form-section">
    <div class="form-container">
      <h2 class="text-center">Register User (Admin Only)</h2>
      <div id="successMsg" style="display: none;"></div>
      <div id="registerForm">
        <input type="text" class="form-control" id="fullName" placeholder="Full Name" required />
        <input type="text" class="form-control" id="username" placeholder="Username (Logon Name)" required />
        <input type="password" class="form-control" id="password" placeholder="Password" required />
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required />
        <button type="button" class="btn btn-neon mt-3" id="registerBtn">Register</button>
      </div>
    </div>
  </div>
  <script>

function sanitizeHTML(str) {
  const temp = document.createElement("div");
  temp.textContent = str;
  return temp.innerHTML;
}

const token = localStorage.getItem("token");

  if (!token) {
    window.location.href = "login.html"; 
  } else {

    fetch("http://127.0.0.1:5000/user_info", {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data.role !== "admin") {

        window.location.href = "dashboard.html";
      }
    })
    .catch(error => {
      console.error("Error checking admin role:", error);
      window.location.href = "login.html";  
    });
  }

   document.getElementById("registerBtn").addEventListener("click", async function () {
  const fullName = document.getElementById("fullName").value.trim();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();
  const messageBox = document.getElementById("successMsg");

  if (!fullName || !username || !password || !confirmPassword) {
    messageBox.style.display = "block";
    messageBox.innerHTML = sanitizeHTML("❌ Please fill in all fields.");
    messageBox.style.color = "red";
    return;
  }

  if (password !== confirmPassword) {
    messageBox.style.display = "block";
    messageBox.innerHTML = sanitizeHTML("❌ Passwords do not match.");
    messageBox.style.color = "red";
    return;
  }

  const [first_name, ...last_parts] = fullName.split(" ");
  const last_name = last_parts.join(" ") || "_";

  try {
    const response = await fetch("http://127.0.0.1:5000/register_user", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": localStorage.getItem("token")
      },
      body: JSON.stringify({
        first_name,
        last_name,
        username,
        password
      })
    });

    const result = await response.json();

    if (response.ok && result.message) {
      messageBox.style.display = "block";
      messageBox.innerHTML = sanitizeHTML("✅ " + result.message);
      messageBox.style.color = "lime";


      document.getElementById("fullName").value = "";
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      document.getElementById("confirmPassword").value = "";

    } else {
      messageBox.style.display = "block";
      messageBox.innerHTML = sanitizeHTML("❌ " + (result.error || "Registration failed."));
      messageBox.style.color = "red";
    }

  } catch (error) {
    console.error("❌ Fetch error:", error);
    messageBox.style.display = "block";
    messageBox.innerText = " Server error while connecting.";
    messageBox.style.color = "red";
  }
});

  </script>
  
  
</body>
</html>

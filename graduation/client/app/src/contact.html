<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | IntegriMail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      scroll-behavior: smooth;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: bold;
      color: #0099ff !important;
      transition: color 0.3s ease;
    }

    .navbar-brand:hover {
      color: #00ccff !important;
    }

    .navbar-brand img {
      width: 30px;
      height: 30px;
      margin-right: 8px;
    }

    .navbar-nav .nav-link {
      position: relative;
      margin-right: 15px;
      color: #fff !important;
      transition: all 0.3s ease-in-out;
    }

    .navbar-nav .nav-link::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: #00ccff;
      transition: width 0.3s ease-in-out;
    }

    .navbar-nav .nav-link:hover::after {
      width: 100%;
    }

    .navbar-nav .btn-outline-light:hover {
      background-color: transparent;
      color: #00ccff !important;
      border-color: #00ccff;
      box-shadow: 0 0 10px #00ccff;
    }

    .form-section {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 20px 20px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-direction: column;
    }

    .form-container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 15px;
      border: 1px solid rgba(0, 153, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.1);
      animation: fadeIn 1.5s ease-in-out;
      max-width: 360px;
      width: 100%;
      margin: 5px auto 0;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .form-control {
      width: 100%;
      max-width: 340px;
      margin: 12px auto;
      background-color: transparent;
      border: 2px solid #0099ff;
      color: white;
      border-radius: 8px;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .form-control:focus {
      background-color: transparent;
      color: white;
      box-shadow: 0 0 8px #0099ff;
      border-color: #0099ff;
    }

    .btn-neon {
      background-color: #0099ff;
      color: #000;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px #0099ff, 0 0 20px #0099ff;
      transition: 0.3s ease;
      width: 100%;
      max-width: 340px;
    }

    .btn-neon:hover {
      background-color: #007acc;
      box-shadow: 0 0 15px #0099ff, 0 0 25px #0099ff;
    }

    .lead {
      color: #0099ff;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .success-message {
      color: lime;
      margin-top: 15px;
      font-weight: bold;
    }

    .error-message {
      color: red;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop class="video-bg">
    <source src="assets/videos/background.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="assets/images/email-sec-icon.png" alt="Logo">
        IntegriMail
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="landing.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="#contact">Contact</a></li>
          <a class="nav-link btn btn-outline-light btn-sm ms-2" href="dashboard.html">Dashboard</a>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Section -->
  <div class="form-section" id="contact">
    <div class="form-container">
      <h2 style="color: #00ccff;">📞 Contact Us</h2>
      <p class="lead">We would love to hear from you! Please feel free to reach out with any inquiries or feedback.</p>

      <!-- Contact Form -->
      <form onsubmit="sendMessage(event)">
        <input type="text" id="name" class="form-control" placeholder="Your Name" required>
        <input type="email" id="email" class="form-control" placeholder="Your Email" required>
        <input type="text" id="subject" class="form-control" placeholder="Subject" required>
        <textarea id="message" class="form-control" placeholder="Your Message" required></textarea>
        <button type="submit" class="btn btn-neon mt-3">Send Message</button>
        <div id="responseMessage"></div>
      </form>

      <!-- Contact Info -->
      <div class="contact-info mt-4">
        <p><strong>📞 Phone:</strong> 0786135679</p>
        <p><strong>📧 Email:</strong> supporteam@emailchecker4u.com</p>
        
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 IntegriMail. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>

function sanitizeHTML(str) {
  const temp = document.createElement("div");
  temp.textContent = str;
  return temp.innerHTML;
}


    function sendMessage(event) {
      event.preventDefault();
    
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const subject = document.getElementById('subject').value; 
      const message = document.getElementById('message').value;
      const responseMessage = document.getElementById('responseMessage');
    
      fetch('http://127.0.0.1:5000/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, subject, message }) 
      })
      .then(response => response.json())
      .then(data => {
        if (data.message) {
            responseMessage.innerHTML = "✅ " + sanitizeHTML(data.message);  
            responseMessage.className = "success-message";
          } else {
            responseMessage.innerHTML = "❌ " + sanitizeHTML(data.error || "Something went wrong.");
            responseMessage.className = "error-message";
            }
      })
      .catch(error => {
        console.error('Error:', error);
        responseMessage.textContent = "❌ Failed to send message!";
        responseMessage.className = "error-message";
      });
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | IntegriMail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: bold;
      color: #00ccff !important;
    }

    .navbar-brand img {
      width: 30px;
      height: 30px;
      margin-right: 8px;
    }

    .form-section {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .form-container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 15px;
      border: 1px solid rgba(0, 153, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.2);
      max-width: 400px;
      width: 100%;
    }

    .form-control {
      background-color: transparent;
      border: 2px solid #00ccff;
      color: white;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .form-control:focus {
      box-shadow: 0 0 10px #00ccff;
      border-color: #00ccff;
    }

    .btn-neon {
      background-color: #00ccff;
      color: black;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff;
      transition: 0.3s ease;
      width: 100%;
    }

    .btn-neon:hover {
      background-color: #007acc;
      box-shadow: 0 0 15px #00ccff, 0 0 25px #00ccff;
    }

    h2 {
      color: #00ccff;
      margin-bottom: 20px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="video-bg">
    <source src="assets/videos/background.mp4" type="video/mp4">
  </video>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="assets/images/email-sec-icon.png" alt="Logo">
        IntegriMail
      </a>
    </div>
  </nav>

  <!-- Forgot Password Form -->
  <div class="form-section">
    <div class="form-container">
      <h2>Forgot Your Password?</h2>
      <form onsubmit="handleSubmit(event)">
        <!-- Step 1: Enter Email -->
        <div id="step1">
          <input type="email" id="email" name="email" class="form-control" placeholder="Your Email" required />
          <button type="submit" class="btn btn-neon mt-3">Next</button>
        </div>

        <!-- Step 2: Enter 2FA -->
        <div id="step2" style="display:none;">
          <input type="text" id="twoFACode" name="twoFACode" class="form-control" placeholder="Enter 2FA Code" required disabled />
          <button type="submit" class="btn btn-neon mt-3">Verify</button>
        </div>

        <!-- Step 3: Reset Password -->
        <div id="step3" style="display:none;">
          <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="New Password" required disabled />
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm Password" required disabled />
          <button type="submit" class="btn btn-neon mt-3">Reset Password</button>
        </div>

        <div class="message mt-3" id="message"></div>
      </form>

      <div class="mt-3">
        <a href="login.html" style="color: #00ccff;">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    let currentStep = 1;
    let resetToken = "";

    function sanitizeHTML(str) {
  const temp = document.createElement("div");
  temp.textContent = str;
  return temp.innerHTML;
}


    function showStep(step) {
      document.getElementById('step1').style.display = step === 1 ? 'block' : 'none';
      document.getElementById('step2').style.display = step === 2 ? 'block' : 'none';
      document.getElementById('step3').style.display = step === 3 ? 'block' : 'none';

      // Enable/Disable inputs
      document.getElementById('twoFACode').disabled = step !== 2;
      document.getElementById('newPassword').disabled = step !== 3;
      document.getElementById('confirmPassword').disabled = step !== 3;
    }

    function handleSubmit(event) {
    event.preventDefault();
    const message = document.getElementById("message");

    if (currentStep === 1) {
      const email = document.getElementById("email").value;
      fetch("http://127.0.0.1:5000/request_password_reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          message.innerHTML = "❌ " + sanitizeHTML(data.error);
          message.style.color = "red";
        } else {
          message.innerHTML = "✅ " + sanitizeHTML(data.message);
          message.style.color = "lime";
          showStep(2);
          currentStep = 2;
        }
      });
    } else if (currentStep === 2) {
      const email = document.getElementById("email").value;
      const token2fa = document.getElementById("twoFACode").value;
      fetch("http://127.0.0.1:5000/verify_2fa_for_reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, token: token2fa })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          message.innerHTML = "❌ " + sanitizeHTML(data.error);
          message.style.color = "red";
        } else {
          message.innerHTML = "✅ " + sanitizeHTML(data.message);
          message.style.color = "lime";
          resetToken = data.reset_token;
          showStep(3);
          currentStep = 3;
        }
      });
    } else if (currentStep === 3) {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        message.innerHTML = "❌ Passwords do not match!";
        message.style.color = "red";
        return;
      }

      fetch("http://127.0.0.1:5000/reset-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": resetToken
        },
        body: JSON.stringify({
          new_password: newPassword,
          confirm_password: confirmPassword
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          message.innerHTML = "❌ " + sanitizeHTML(data.error);
          message.style.color = "red";
        } else {
          message.innerHTML = "✅ " + sanitizeHTML(data.message);
          message.style.color = "lime";
        }
      });
    }
  }
  </script>
</body>
</html>

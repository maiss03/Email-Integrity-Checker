<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Integrity Checker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: bold;
      color: #0099ff !important;
      transition: color 0.3s ease;
    }

    .navbar-brand:hover {
      color: #00ccff !important;
    }

    .navbar-brand img {
      width: 30px;
      height: 30px;
      margin-right: 8px;
    }

    .navbar-nav .nav-link {
      position: relative;
      margin-right: 15px;
      color: #fff !important;
      transition: all 0.3s ease-in-out;
    }

    .navbar-nav .nav-link::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: #00ccff;
      transition: width 0.3s ease-in-out;
    }

    .navbar-nav .nav-link:hover::after {
      width: 100%;
    }

    .navbar-nav .btn-outline-light:hover {
      background-color: transparent;
      color: #00ccff !important;
      border-color: #00ccff;
      box-shadow: 0 0 8px #00ccff;
    }

    .hero {
      height: 100vh;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.6);
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      max-width: 700px;
    }

    .btn-neon {
      background-color: #0099ff;
      color: #000;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px #0099ff, 0 0 20px #0099ff;
      transition: 0.3s ease;
      padding: 10px 25px;
      margin: 10px;
      min-width: 140px;
    }

    .btn-neon:hover {
      background-color: #007acc;
      box-shadow: 0 0 15px #0099ff, 0 0 25px #0099ff;
    }

    @media (max-width: 576px) {
      .hero h1 {
        font-size: 2rem;
      }
      .hero p {
        font-size: 1rem;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="video-bg">
    <source src="assets/videos/background.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

 <!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="assets/images/email-sec-icon.png" alt="Logo">
      IntegriMail
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>
        
      </ul>
    </div>
  </div>
</nav>

  <!-- Hero Section -->
  <div class="hero">
    <h1>Email Integrity Checker</h1>
    <p>A secure platform to verify the integrity of emails, protect your communication, and ensure message authenticity within your organization.</p>
    <div>
      <a href="login.html" class="btn btn-neon">Login</a>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

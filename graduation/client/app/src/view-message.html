<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View Message | IntegriMail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
    }

    .navbar-brand {
      color: #00ccff !important;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    .navbar-brand img {
      width: 30px;
      height: 30px;
      margin-right: 8px;
    }

    .container {
      margin-top: 60px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 204, 255, 0.3);
    }

    .msg-label {
      font-weight: bold;
      color: #00ccff;
    }

    .msg-value {
      color: #ccc;
    }

    .status-verified {
      color: #00ff99;
      font-weight: bold;
    }

    .status-tampered {
      color: #ff4d4d;
      font-weight: bold;
    }

    pre {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      color: #00ccff;
    }
    .btn-neon {
  background-color: #00ccff;
  color: black;
  font-weight: bold;
  border: none;
  box-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff;
  transition: 0.3s ease;
}

.btn-neon:hover {
  background-color: #007acc;
  box-shadow: 0 0 15px #00ccff, 0 0 25px #00ccff;
}

  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="video-bg">
    <source src="assets/videos/background.mp4" type="video/mp4">
  </video>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="assets/images/email-sec-icon.png" alt="Logo">
        IntegriMail
      </a>
    </div>
  </nav>

  <!-- Message Details -->
  <div class="container mt-5" id="message-content">
    <h2 class="mb-4 text-center" style="color:#00ccff;">📩 Message Details</h2>
    <p class="text-center">Loading message...</p>
  </div>

  <script>

function sanitize(str) {
  const temp = document.createElement('div');
  temp.textContent = str;
  return temp.innerHTML;
}


    const token = localStorage.getItem("token");

    if (!token) {

      window.location.replace("login.html");
    }


const params = new URLSearchParams(window.location.search);

const message = {
  from: sanitize(params.get('from')),
  to: sanitize(params.get('to')),
  subject: sanitize(params.get('subject')),
  date: sanitize(params.get('date')),
  status: sanitize(params.get('status')),
  content: sanitize(params.get('content'))
};



const container = document.getElementById("message-content");

if (!message.from) {
  container.innerHTML = "<h4 class='text-center text-danger'>Message not found.</h4>";
} else {
  container.innerHTML = `
    <div class="row mb-3">
      <div class="col-md-3 msg-label">From:</div>
      <div class="col-md-9 msg-value">${message.from}</div>
    </div>
    <div class="row mb-3">
      <div class="col-md-3 msg-label">To:</div>
      <div class="col-md-9 msg-value">${message.to}</div>
    </div>
    <div class="row mb-3">
      <div class="col-md-3 msg-label">Subject:</div>
      <div class="col-md-9 msg-value">${message.subject}</div>
    </div>
    <div class="row mb-3">
      <div class="col-md-3 msg-label">Date:</div>
      <div class="col-md-9 msg-value">${message.date}</div>
    </div>
    <div class="row mb-4">
      <div class="col-md-3 msg-label">Status:</div>
      <div class="col-md-9 msg-value ${
        message.status === "Valid" ? "status-verified" : (message.status === "Tampered" ? "status-tampered" : "status-external")
      }">${message.status === "Valid" ? "✅ Verified" : (message.status === "Tampered" ? "⚠️ Tampered" : "🌐 External")}</div>
    </div>
    <div class="row mb-4">
      <div class="col-md-3 msg-label">Content:</div>
      <div class="col-md-9"><pre>${message.content}</pre></div>
    </div>
    <div class="text-center mt-4">
      <a id="backButton" class="btn btn-neon">⬅️ Back</a>
    </div>
  `;
}



const source = new URLSearchParams(window.location.search).get('source') || localStorage.getItem('emailSource');
const backButton = document.getElementById('backButton');

if (source === 'recent') {
  backButton.href = 'recent-messages.html';
} else if (source === 'alerts') {
  backButton.href = 'alerts.html';
} else if (source === 'admin') {
  backButton.href = 'admin.html';
} else {
  backButton.href = 'inbox.html';
}


  </script>

</body>
</html>

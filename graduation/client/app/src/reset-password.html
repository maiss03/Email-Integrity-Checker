  <style>

      /* Sidebar */
.sidebar {

  height: 100vh;
  background-color: #201c2a;
  padding: 20px;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 999;
}

.sidebar h2 {
  color: #00ccff;
}

.sidebar a {
  display: block;
  color: #00ccff;
  text-decoration: none;
  margin: 15px 0;
  font-weight: bold;
}

.sidebar a:hover {
  text-decoration: underline;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #201c2a;
  padding: 15px 30px;
  color: white;
  border-bottom: 2px solid #0ff;
  position: fixed; 
  top: 0;
  left: 250px; 
  right: 0;
  z-index: 1000;
}

.navbar h3 {
    margin: 0;
    font-size: 22px;
}

.navbar-brand {
      display: flex;
      align-items: center;
      font-weight: bold;
      color: #00ccff !important;
    }
    .navbar-brand img {
      width: 30px;

      margin-right: 8px;

.navbar .icons {
    display: flex;
    align-items: center;
    justify-content: flex-end;

}

.navbar .user-circle {

}

.navbar .notification {
    order: 2;
}

.navbar .settings {

}



.user-circle {
  width: 40px;
  height: 40px;
  background-color: #00ccff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  color: black;
  position: relative;
  cursor: pointer;
  margin-right: 10px;
}

.user-initial {
  pointer-events: none; 
}




.notification, .settings {
  position: relative;
  cursor: pointer;
  font-weight: bold;
  background: none;
  color: black;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  text-align: center;
  line-height: 40px;
  font-size: 18px;
}

.user-circle .dropdown {
    display: none;
    position: absolute;
    top: 50px;
    right: 0;
    background-color: #152630;
    border: 1px solid #0ff;
    padding: 10px;
    border-radius: 5px;
    z-index: 100;
    animation: fadeIn 0.3s ease;
}

.user-circle:hover .dropdown {
    display: block;
}

.dropdown p {
    margin: 5px 0;
    color: white;
}

.dropdown button {
    background-color: #0ff;
    color: black;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    margin-top: 5px;
    border-radius: 3px;
}

.notification, .settings {
  position: relative;
  margin-right: 20px;
  cursor: pointer;
  color: white;
}

.notification .fa-bell {
  font-size: 20px;
}

.badge {
  position: absolute;
  top: -8px;
  right: -10px;
  padding: 3px 6px;
  border-radius: 50%;
  background: red;
  color: white;
  font-size: 12px;
}


.dropdown {
  position: absolute;
  top: 45px;
  right: 0;
  background-color: #152630;
  border: 1px solid #0ff;
  color: white;
  padding: 10px;
  border-radius: 5px;
  display: none;
  animation: fadeIn 0.3s ease;
  min-width: 180px;
}

.dropdown a {
  display: block;
  color: rgb(255, 255, 255);
  margin-bottom: 8px;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap; 
}

.dropdown a:hover {
  text-decoration: underline;
}

.dropdown p {
  margin: 0 0 5px 0;
}
.notification-dropdown {
    display: none;
    position: absolute;
    top: 40px;
    right: 0;
    background-color: #152630;
    color: white;
    border: 1px solid #0ff;
    border-radius: 5px;
    width: 250px;
    max-height: 300px;
    overflow-y: auto;
    z-index: 1000;
    padding: 10px;
}

.notification-dropdown p {
    margin: 5px 0;
    padding: 5px;
    border-bottom: 1px solid #333;
    font-size: 14px;
}

.notification-dropdown p:last-child {
    border-bottom: none;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}


    /* Notifications + Settings */
.icons {
  display: flex;
  flex-direction: row;
  direction: rtl; 
  gap: -30px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

    .form-section {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 10px 20px 20px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 15px;
      border: 1px solid rgba(0, 153, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 153, 255, 0.2);
      max-width: 400px;
      width: 100%;
    }

    .form-control {
      background-color: transparent;
      border: 2px solid #0099ff;
      color: white;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .form-control:focus {
      box-shadow: 0 0 10px #0099ff;
      border-color: #00ccff;
    }

    .btn-neon {
      background-color: #00ccff;
      color: black;
      font-weight: bold;
      border: none;
      box-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff;
      transition: 0.3s ease;
      width: 100%;
    }

    .btn-neon:hover {
      background-color: #007acc;
      box-shadow: 0 0 15px #00ccff, 0 0 25px #00ccff;
    }

    h2 {
      color: #00ccff;
      margin-bottom: 20px;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop class="video-bg">
    <source src="assets/videos/background.mp4" type="video/mp4">
  </video>

  <div class="sidebar">
    <h2>Menu</h2>
    <a href="dashboard.html">Overview</a>
            <a href="ComposeEmail.html">Compose Email</a>
            <a href="inbox.html">Inbox</a>
            <a href="recent-messages.html">All Mails</a>
            <a href="alerts.html">Alerts</a>
            <a href="contact.html">Contact</a>
           <a href="about.html">About</a>

  </div>

  <div class="navbar">
    <a class="navbar-brand" href="#">
      <img src="assets/images/email-sec-icon.png" alt="Logo">
      IntegriMail
    </a>
    <div class="icons">

      <div class="user-circle" onclick="toggleDropdown()">
        <div class="user-initial">M</div>
        <div class="dropdown" id="userDropdown">
          <p id="userName">User Name</p>
          <p id="userEmail">user@email.com</p>
          <button onclick="logout()">Logout</button>
        </div>
      </div>
      
      
  

      <div class="notification" onclick="toggleNotifications(); markNotificationsAsRead();">
        <i class="fas fa-bell"></i>
        <span class="badge" id="notification-count">0</span>
        <div class="notification-dropdown" id="notificationDropdown">
            <p>No new notifications.</p>
        </div>
    </div>
    
  
      <!--settings -->
      <div class="settings" onclick="toggleSettingsDropdown()">
        <i class="fas fa-cog"></i>
        <div class="dropdown" id="settingsDropdown">
          <a href="reset-password.html">Reset Password</a>
          <a href="change-username.html">Change Username</a>
        </div>
      </div>
    </div>
  </div>


  <!-- Reset Password Form -->
  <div class="form-section">
    <div class="form-container">
      <h2>Reset Your Password</h2>
      <form onsubmit="resetPassword(event)">
        <input type="email" id="email" class="form-control" placeholder="Your Email" required />
        <input type="password" id="oldPassword" class="form-control" placeholder="Old Password" required />
        <input type="password" id="newPassword" class="form-control" placeholder="New Password" required />
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm New Password" required />
        <button type="submit" class="btn btn-neon mt-3">Reset Password</button>
        <div class="message" id="message"></div>
      </form>
    </div>
  </div>

 
  <script>

function sanitizeHTML(str) {
  const temp = document.createElement("div");
  temp.textContent = str;
  return temp.innerHTML;
}

const token = localStorage.getItem("token");

    document.addEventListener("DOMContentLoaded", function () {
    
    if (!token) {

      window.location.replace("login.html");
    } else {
      loadUserInfo();
    fetchNotificationCount();
    }
  });

// Toggle dropdown
function toggleDropdown() {
  const dropdown = document.getElementById("userDropdown");
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}
function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    function resetPassword(event) {
  event.preventDefault();

  const email = document.getElementById('email').value;
  const oldPassword = document.getElementById('oldPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const message = document.getElementById('message');

  if (newPassword !== confirmPassword) {
    message.innerHTML = sanitizeHTML("❌ Passwords do not match!");
    message.style.color = "red";
    return;
  }

  fetch('http://127.0.0.1:5000/change-password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': localStorage.getItem('token')
    },
    body: JSON.stringify({
      email: email,
      old_password: oldPassword,
      new_password: newPassword,
      confirm_password: confirmPassword
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.message) {
      message.innerHTML = sanitizeHTML("✅ " + data.message);
      message.style.color = "lime";
    } else {
      message.innerHTML = sanitizeHTML("❌ " + (data.error || "An error occurred."));
      message.style.color = "red";
    }
  })
  .catch(error => {
    console.error('Error:', error);
    message.innerHTML = sanitizeHTML("❌ Request failed!");
    message.style.color = "red";
  });
}

    async function loadUserInfo() {
  try {
    const response = await fetch("http://127.0.0.1:5000/user_info", {
      method: "GET",
      headers: {
        "Content-Type": "application/json",
        Authorization: token
      }
    });

    const data = await response.json();


    document.getElementById("userName").innerText = data.first_name + " " + data.last_name;
    document.getElementById("userEmail").innerText = data.email;


    const firstLetter = data.first_name.charAt(0).toUpperCase();
    document.querySelector(".user-initial").textContent = firstLetter;


    if (data.role === "admin") {
      const sidebar = document.querySelector(".sidebar");
      const adminLink = document.createElement("a");
      adminLink.href = "admin.html";
      adminLink.textContent = "Admin Panel";
      sidebar.appendChild(adminLink);


      const settingsDropdown = document.getElementById("settingsDropdown");
      const registerLink = document.createElement("a");
      registerLink.href = "register.html";
      registerLink.textContent = "Register User";
      settingsDropdown.appendChild(registerLink);
    }

  } catch (error) {
    console.error("Error loading user info:", error);
  }
}



    function fetchNotificationCount() {
    fetch('http://127.0.0.1:5000/notifications', {
        method: 'GET',
        headers: {
            'Authorization': token
        }
    })
    .then(response => response.json())
    .then(data => {
        const notifications = data.notifications;
        const count = notifications.length;
        document.getElementById('notification-count').textContent = count > 0 ? count : '';
    })
    .catch(error => console.error('Error fetching notification count:', error));
}

    function toggleDropdown() {
  const dropdown = document.getElementById("userDropdown");
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}


function toggleSettingsDropdown() {
  const dropdown = document.getElementById("settingsDropdown");
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}

function toggleNotifications() {
    const dropdown = document.getElementById('notificationDropdown');
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';

    if (dropdown.style.display === 'block') {
        fetch('http://127.0.0.1:5000/notifications', {
            method: 'GET',
            headers: {
                'Authorization': token
            }
        })
        .then(response => response.json())
        .then(data => {
            const notifications = data.notifications;
            const dropdown = document.getElementById('notificationDropdown');
            dropdown.innerHTML = '';

            if (notifications.length === 0) {
                dropdown.innerHTML = '<p>No new notifications.</p>';
            } else {
                notifications.forEach(notif => {
                    dropdown.innerHTML += `<p>${notif.message}</p>`;
                });
            }
        });
    }
}

function markNotificationsAsRead() {
    fetch('http://127.0.0.1:5000/notifications/mark_as_read', {
        method: 'POST',
        headers: {
            'Authorization': token
        }
    })
    .then(response => response.json())
    .then(data => {
        console.log('Notifications marked as read:', data);
        document.getElementById('notification-count').textContent = '';
    })
    .catch(error => console.error('Error marking notifications as read:', error));
}



window.onclick = function(event) {
  if (!event.target.closest('.user-circle')) {
    document.getElementById("userDropdown").style.display = "none";
  }
  if (!event.target.closest('.notification')) {
    document.getElementById("notificationDropdown").style.display = "none";
  }
  if (!event.target.closest('.settings')) {
    document.getElementById("settingsDropdown").style.display = "none";
  }
}


  </script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
